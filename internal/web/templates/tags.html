{{define "tags"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tags — Shiori</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
{{template "header" .}}
<h1>Tags</h1>
{{if .Tags}}
<ul class="taglist">
  {{range .Tags}}
  <li><a href="/?tag={{.Name}}" class="pill">#{{.Name}}</a> <span class="muted">{{.Count}}</span></li>
  {{end}}
</ul>
{{else}}
<p class="empty">No tags yet.</p>
{{end}}
{{template "footer" .}}
</main>
</body>
</html>{{end}}
